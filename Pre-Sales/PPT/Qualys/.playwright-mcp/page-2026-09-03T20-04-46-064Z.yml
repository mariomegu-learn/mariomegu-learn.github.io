    - region "Una plataforma, decisiones accionables":
      - article:
        - generic:
          - paragraph: Solución
          - heading "Una plataforma, decisiones accionables" [level=2]
          - paragraph: Qualys centraliza descubrimiento, inventario, evaluación, priorización y remediación en una única plataforma cloud. Así, seguridad, infraestructura y desarrollo trabajan sobre la misma visión del riesgo y pueden actuar con rapidez.
        - generic:
          - article:
            - generic: "01"
            - heading "Visibilidad continua" [level=3]
            - paragraph: Descubre y clasifica activos, aplicaciones, APIs y cargas cloud para mantener un inventario confiable y una cobertura continua de la superficie de ataque.
          - article:
            - generic: "02"
            - heading "Riesgo contextual" [level=3]
            - paragraph: Correlaciona vulnerabilidades con criticidad del activo, amenazas, exposición y contexto de negocio para concentrar recursos en los hallazgos que más importan.
          - article:
            - generic: "03"
            - heading "Acción automatizada" [level=3]
            - paragraph: Orquesta asignación y remediación mediante flujos e integraciones, verifica cada corrección y proporciona métricas de progreso para reducir el MTTR de forma medible.
